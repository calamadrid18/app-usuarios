name: app-usuarios

services:
  api:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Usa la MongoDB del contenedor "mongo" en vez de Atlas
      MONGODB_URI: mongodb://mongo:27017/backend
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy # espera a que Mongo esté listo
    restart: unless-stopped # si se cae, Docker lo vuelve a encender

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
